name: ChatGPT AHRI validation

on:
  push:
    branches:
      - chatgpt/ahri-multicapacity-core-gui
  pull_request:
    branches:
      - main

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install -q --upgrade pip
          if [ -f requirements.txt ]; then pip install -q -r requirements.txt; fi
          pip install -q pytest
      - name: Compile changed owners
        run: |
          python -m compileall -q core/calculators apps/calculator tests/test_ahri_multicapacity_2026.py
      - name: Focused AHRI tests
        id: focused_tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb >/dev/null
          set +e
          xvfb-run -a pytest -q -x \
            tests/test_ahri_multicapacity_2026.py \
            tests/test_ahri_multicapacity_overlay.py \
            tests/test_standard_calculation_capability.py \
            tests/test_apps_calculator_ui_ahri_seer2.py \
            tests/test_apps_calculator_ui_ahri_hspf2.py \
            tests/test_ui_tk_ahri_seer2_batch.py \
            tests/test_ui_tk_ahri_hspf2_batch.py \
            tests/test_ui_tk_ahri_seer2_detail.py \
            tests/test_ui_tk_ahri_hspf2_detail.py \
            > pytest.log 2>&1
          status=$?
          cat pytest.log
          exit $status
      - name: Upload focused test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ahri-focused-test-log
          path: pytest.log
      - name: Structure guard
        if: steps.focused_tests.outcome == 'success'
        run: python -B tools/check_code_structure.py
