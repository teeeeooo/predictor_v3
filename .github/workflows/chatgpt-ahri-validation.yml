name: ChatGPT AHRI validation

on:
  push:
    branches:
      - chatgpt/ahri-multicapacity-core-gui
  pull_request:
    branches:
      - main

jobs:
  ahri-and-calculator-validation:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install -q --upgrade pip
          if [ -f requirements.txt ]; then pip install -q -r requirements.txt; fi
          pip install -q pytest
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb >/dev/null
      - name: Compile changed owners
        run: |
          python -m compileall -q \
            core/calculators \
            apps/calculator \
            tests/test_ahri_multicapacity_2026.py \
            tests/test_ahri_multicapacity_overlay.py \
            tests/test_ahri_multicapacity_audit_corrections.py
      - name: Focused AHRI audit-correction tests
        id: focused_tests
        run: |
          set +e
          xvfb-run -a pytest -q -x \
            tests/test_ahri_multicapacity_2026.py \
            tests/test_ahri_multicapacity_overlay.py \
            tests/test_ahri_multicapacity_audit_corrections.py \
            tests/test_standard_calculation_capability.py \
            tests/test_apps_calculator_ui_ahri_seer2.py \
            tests/test_apps_calculator_ui_ahri_hspf2.py \
            tests/test_ui_tk_ahri_seer2_batch.py \
            tests/test_ui_tk_ahri_hspf2_batch.py \
            tests/test_ui_tk_ahri_seer2_detail.py \
            tests/test_ui_tk_ahri_hspf2_detail.py \
            tests/test_ui_tk_ahri_multicapacity_products.py \
            > pytest-focused.log 2>&1
          status=$?
          cat pytest-focused.log
          exit $status
      - name: Upload focused test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ahri-focused-test-log
          path: pytest-focused.log
      - name: Calculator regression suite
        id: calculator_tests
        if: steps.focused_tests.outcome == 'success'
        run: |
          mapfile -t calculator_tests < <(
            find tests -type f -name 'test*.py' -print \
              | sort \
              | grep -E '(^tests/(ahri_refactor|calculator|calculators)/|test_.*(ahri|calculator|standard_calculation|apps_calculator|ui_tk))'
          )
          if [ "${#calculator_tests[@]}" -eq 0 ]; then
            echo 'No Calculator tests were discovered.' >&2
            exit 1
          fi
          printf 'Calculator test files (%s):\n' "${#calculator_tests[@]}"
          printf '  %s\n' "${calculator_tests[@]}"
          git worktree add --detach /tmp/predictor-main origin/main
          (
            cd /tmp/predictor-main
            PYTHONPATH=. xvfb-run -a python -B - <<'PY'
          import tkinter as tk
          from apps.calculator.ui.calculator_app import CalculatorTkApp

          root = tk.Tk()
          root.withdraw()
          try:
              app = CalculatorTkApp(root=root)
              root.update_idletasks()
              root.update()
              print('Main baseline geometry:')
              print('  root:', root.winfo_width(), root.winfo_height())
              print('  iso preferred:', app.iso_tab.preferred_initial_size())
              print(
                  '  iso diagnostics:',
                  dict(app.iso_tab._measurement.snapshot().diagnostics),
              )
          finally:
              root.destroy()
          PY
          ) > pytest-calculator.log 2>&1
          xvfb-run -a python -B - <<'PY' >> pytest-calculator.log 2>&1
          import tkinter as tk
          from apps.calculator.ui.calculator_app import CalculatorTkApp

          root = tk.Tk()
          root.withdraw()
          try:
              app = CalculatorTkApp(root=root)
              root.update_idletasks()
              root.update()
              snapshot = app.iso_tab._measurement.snapshot()
              print('PR geometry:')
              print('  root:', root.winfo_width(), root.winfo_height())
              print('  iso preferred:', app.iso_tab.preferred_initial_size())
              print('  iso diagnostics:', dict(snapshot.diagnostics))
              print(
                  '  top-tab requested heights:',
                  {
                      app.notebook.tab(tab_id, 'text'): app.notebook.nametowidget(
                          tab_id
                      ).winfo_reqheight()
                      for tab_id in app.notebook.tabs()
                  },
              )
          finally:
              root.destroy()
          PY
          set +e
          xvfb-run -a pytest -q "${calculator_tests[@]}" \
            >> pytest-calculator.log 2>&1
          status=$?
          cat pytest-calculator.log
          exit $status
      - name: Upload Calculator regression log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calculator-regression-test-log
          path: pytest-calculator.log
          if-no-files-found: ignore
      - name: Staged change gate
        if: steps.calculator_tests.outcome == 'success'
        run: |
          git fetch origin main:refs/remotes/origin/main
          git read-tree refs/remotes/origin/main
          git add -A
          git diff --cached --check
          python -B tools/check_agent_change_gate.py --cached
          git reset --mixed HEAD
      - name: Structure guard
        if: steps.calculator_tests.outcome == 'success'
        run: python -B tools/check_code_structure.py
