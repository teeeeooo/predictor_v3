name: Repository policy validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate changed repository policy surface
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_ref="$PR_BASE"
          else
            base_ref="$PUSH_BASE"
          fi
          zero_sha=0000000000000000000000000000000000000000
          if [ -z "$base_ref" ] || [ "$base_ref" = "$zero_sha" ]; then
            base_ref="$(git rev-list --max-parents=0 "$HEAD_SHA" | tail -n 1)"
          fi

          index_file="$RUNNER_TEMP/repository-policy-index"
          rm -f "$index_file"
          export GIT_INDEX_FILE="$index_file"
          git read-tree "$base_ref"
          git add -A
          git diff --cached --check
          python -B tools/check_agent_change_gate.py --cached
